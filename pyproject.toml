[project]
name = "project-reforged-linux"
version = "1.0.0"
description = "Linux launcher for Project Reforged"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = [
    "PySide6>=6.8,<6.12",
    "platformdirs>=4.2",
    "sjaandi-kista>=0.9,<0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "bandit>=1.7",
]

[tool.setuptools.packages.find]
include = ["project_reforged_linux*"]

[tool.setuptools.package-data]
project_reforged_linux = ["data/icons/hicolor/*/apps/*", "data/fonts/*/*", "data/art/*",
                          "data/ui-icons/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
filterwarnings = [
    "error::DeprecationWarning",
    "error::ResourceWarning",
]
markers = [
    "integration: tests that run Wine or the built image",
    "network: tests that may open connections (run by hand only)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603", "S607"]
